[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  command = "node --test && node scripts/build-gallery.mjs"
  publish = "dist"

[[redirects]]
  from = "/gallery"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/activity"
  to = "/activity/"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/signin/"
  status = 301
